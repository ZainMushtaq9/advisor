# Alembic configuration — PSX Intelligence AI, Phase 2 (Team D).
# The database URL is NOT stored here. migrations/env.py reads DATABASE_URL
# from the environment (or database/.env, gitignored). A placeholder below
# exists only so Alembic does not crash before env.py replaces it.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://psx_app:CHANGE_ME@localhost:5432/psx_intelligence

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
