[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-intelligence-ai-backend"
version = "0.1.0"
description = "PSX Intelligence AI — Phase 2 backend foundation (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    # Exact pins, installed and verified 2026-11-04 (Phase 1 gate G-04).
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.7",
    "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
